spring.application.name=LocationAvailabilityService
server.port=9090

spring.datasource.url=jdbc:postgresql://localhost:5432/ProdDB
spring.datasource.username=postgres
spring.datasource.password=tiger
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

#cahing using redis
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
#spring.redis.time-to-live=600000 # Cache expires in 10 minutes

# Logging Configuration
# Log level for different packages
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.tdit=DEBUG 

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file location (optional)
logging.file.name=logs/application.log
logging.file.path=logs

# Rolling log files (Spring Boot 2.2+)
logging.logback.rollingpolicy.file-name-pattern=logs/application-%d{yyyy-MM-dd}.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=10


management.endpoints.web.exposure.include=*

